name: N'sK CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  verify-schema:
    name: Verify Supabase schema (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run schema verification (RLS coverage, FK integrity, parens)
        run: python3 scripts/verify_schema.py

  web:
    name: Web — lint, typecheck, unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  mobile:
    name: Mobile — analyze, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Nessuna versione pinnata: "3.24.0" era ormai troppo vecchia e la
          # sua flutter_localizations non è compatibile con intl ^0.20.2
          # (richiesto da flutter_localizations sulle versioni Flutter recenti,
          # vedi commit 64274c5). Si segue sempre l'ultima stable per restare
          # allineati a quanto usato in locale dagli sviluppatori.
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Applica le migration sul progetto Supabase di STAGING solo dopo che
  # verify-schema + web + mobile sono passati. Il deploy su PROD (Step 11,
  # sezione CI/CD) è un job separato triggerato solo su merge a main, con
  # approvazione manuale — non incluso qui per evitare deploy accidentali
  # da uno scaffold di partenza.
  migration-dry-run:
    name: Supabase migration dry-run (staging)
    runs-on: ubuntu-latest
    needs: [verify-schema, web]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder — richiede SUPABASE_ACCESS_TOKEN e progetto staging configurati
        run: |
          echo "Configurare supabase/setup-cli + 'supabase db push --dry-run' con i secrets del progetto staging."
