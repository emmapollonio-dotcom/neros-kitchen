name: N'sK CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  verify-schema:
    name: Verify Supabase schema (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run schema verification (RLS coverage, FK integrity, parens)
        run: python3 scripts/verify_schema.py

  web:
    name: Web — lint, typecheck, unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  mobile:
    name: Mobile — analyze, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Nessuna versione pinnata: "3.24.0" era ormai troppo vecchia e la
          # sua flutter_localizations non è compatibile con intl ^0.20.2
          # (richiesto da flutter_localizations sulle versioni Flutter recenti,
          # vedi commit 64274c5). Si segue sempre l'ultima stable per restare
          # allineati a quanto usato in locale dagli sviluppatori.
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Deploy automatico dell'Agent Orchestrator (Edge Function) sul merge a
  # main, dopo che verify-schema + web + mobile sono passati. Sostituisce il
  # deploy manuale fatto finora via Supabase MCP/CLI. Rischio basso: è codice
  # stateless, un rollback è semplicemente un nuovo deploy della versione
  # precedente da git. Richiede il secret SUPABASE_ACCESS_TOKEN (vedi
  # CI-CD-SETUP.md).
  deploy-edge-function:
    name: Deploy Agent Orchestrator (prod)
    runs-on: ubuntu-latest
    needs: [verify-schema, web, mobile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy agent-orchestrator
        working-directory: supabase
        run: supabase functions deploy agent-orchestrator --project-ref xjvrhoweghzfvwjsvwla
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # NOTA sulle migration DB: a differenza dell'Edge Function, l'apply dello
  # schema Postgres NON è automatizzato in CI, di proposito. Non esiste un
  # progetto Supabase di staging separato dal produzione (vedi MIGRAZIONI.md
  # per come vengono gestiti oggi i cambi di schema): applicare
  # automaticamente su ogni merge modifiche scritte da un'AI a un database
  # con prenotazioni e pagamenti reali, senza un ambiente di prova
  # intermedio, è un rischio che vale la pena tenere come passo manuale
  # deliberato piuttosto che automatizzare "per completezza". `verify-schema`
  # sopra resta comunque il controllo automatico statico (RLS, FK, sintassi)
  # su ogni push/PR.
