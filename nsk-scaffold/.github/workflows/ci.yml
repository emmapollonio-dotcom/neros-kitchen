name: N'sK CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  verify-schema:
    name: Verify Supabase schema (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run schema verification (RLS coverage, FK integrity, parens)
        run: python3 scripts/verify_schema.py

  web:
    name: Web — lint, typecheck, unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  mobile:
    name: Mobile — analyze, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Nessuna versione pinnata: "3.24.0" era ormai troppo vecchia e la
          # sua flutter_localizations non è compatibile con intl ^0.20.2
          # (richiesto da flutter_localizations sulle versioni Flutter recenti,
          # vedi commit 64274c5). Si segue sempre l'ultima stable per restare
          # allineati a quanto usato in locale dagli sviluppatori.
          channel: stable
      - run: flutter pub get
      # Genera lib/l10n/generated/app_localizations*.dart dalle ARB in
      # lib/l10n/ (it/en/fr/es/ar) — non committato, vedi .gitignore.
      - run: flutter gen-l10n
      # Genera app_database.g.dart (drift) e i provider *.g.dart
      # (riverpod_generator): non committati di proposito, vedi .gitignore.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  # Deploy automatico dell'Agent Orchestrator (Edge Function) sul merge a
  # main, dopo che verify-schema + web + mobile sono passati. Sostituisce il
  # deploy manuale fatto finora via Supabase MCP/CLI. Rischio basso: è codice
  # stateless, un rollback è semplicemente un nuovo deploy della versione
  # precedente da git. Richiede il secret SUPABASE_ACCESS_TOKEN (vedi
  # CI-CD-SETUP.md).
  deploy-edge-function:
    name: Deploy Agent Orchestrator (prod)
    runs-on: ubuntu-latest
    needs: [verify-schema, web, mobile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy agent-orchestrator
        working-directory: supabase
        run: supabase functions deploy agent-orchestrator --project-ref xjvrhoweghzfvwjsvwla
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # Migration DB — ora automatizzate, ma SOLO verso staging, mai verso
  # produzione. Prima (vedi MIGRAZIONI.md) non esisteva un progetto Supabase
  # di staging separato dalla produzione: applicare in automatico su ogni
  # merge modifiche di schema scritte da un'AI a un database con
  # prenotazioni e pagamenti reali, senza un ambiente di prova intermedio,
  # era un rischio evitabile. Ora un secondo progetto Supabase gratuito
  # (qpgjfrlpztoqrttjirpn, riuso di un progetto vuoto rimasto da un primo
  # setup) fa da staging: ogni push/PR applica qui i file in
  # supabase/migrations/ con `supabase db push`, così un errore di sintassi
  # o un vincolo che rompe dati esistenti si vede in CI prima di toccare
  # produzione. La promozione a produzione resta un passo manuale
  # deliberato (Supabase MCP/CLI), non automatico — stesso principio di
  # prima, ma ora con una rete di sicurezza reale prima del passo finale.
  migrate-staging:
    name: Applica migration su staging (Supabase)
    runs-on: ubuntu-latest
    needs: [verify-schema]
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: supabase db push (staging)
        working-directory: supabase
        # --password richiesto: db push si collega direttamente a Postgres
        # (non solo alla Management API), quindi serve anche la password del
        # database di staging, non solo il token — secret separato, vedi
        # CI-CD-SETUP.md.
        run: supabase db push --project-ref qpgjfrlpztoqrttjirpn --include-all --password "$SUPABASE_STAGING_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
